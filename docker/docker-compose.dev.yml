name: autoscanner-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoscanner-postgres
    environment:
      POSTGRES_USER: autoscanner
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: autoscanner
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoscanner -d autoscanner']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autoscanner-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mongo is prepared but not yet consumed by any worker (only validated in the
  # env schema). It is the heaviest infra container (~hundreds of MB RAM), so it
  # is gated behind the `mongo` compose profile: `pnpm dev:up` does NOT start it.
  # Start it only when a feature needs it: `pnpm dev:up:mongo`.
  mongo:
    image: mongo:7
    container_name: autoscanner-mongo
    profiles: ['mongo']
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: autoscanner-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autoscanner
      MINIO_ROOT_PASSWORD: devpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    container_name: autoscanner-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 autoscanner devpassword &&
        mc mb --ignore-existing local/raw-outputs local/reports local/uploads local/pcap local/screenshots local/backups local/cve-mirror &&
        echo "MinIO buckets ready"
    restart: 'no'

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: autoscanner-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --smp=1
      - --memory=512M
      - --mode=dev-container
      - --default-log-level=warn
    ports:
      - '19092:19092'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # --- Application services (profile: app) ------------------------------------
  # Opt-in so `pnpm dev:up` stays lean (infra only). Bring the app up with:
  #   docker compose -f docker/docker-compose.dev.yml --profile app up -d --build
  # API is published on http://localhost:4000, frontend on http://localhost:4200.
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        APP: api-gateway
    container_name: autoscanner-api
    profiles: ['app']
    # Base config from .env; the in-network overrides below win over it.
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      DATABASE_URL: postgresql://autoscanner:dev@postgres:5432/autoscanner
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: autoscanner
      S3_SECRET_KEY: devpassword
      S3_REGION: us-east-1
      FRONTEND_URL: http://localhost:4200
    # Apply migrations, then boot the API.
    command: sh -c "pnpm prisma migrate deploy && node dist/apps/api-gateway/main.js"
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # SPA runs in the browser -> reach the API on its HOST-published port.
        VITE_API_URL: http://localhost:4000
    container_name: autoscanner-frontend
    profiles: ['app']
    ports:
      - '4200:80'
    depends_on:
      - api-gateway

volumes:
  pgdata:
  redisdata:
  mongodata:
  miniodata:
  redpanda-data:
