name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      API_PORT: 4000
      API_HOST: 0.0.0.0
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'a-test-secret-not-secure-only-for-ci-a-test-secret' }}
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      MASTER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://autoscanner:dev@localhost:5432/autoscanner
      MONGODB_URL: mongodb://localhost:27017/autoscanner
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: autoscanner
      S3_SECRET_KEY: devpassword
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
      OPERATOR_EMAIL: admin@autoscanner.local
      OPERATOR_PASSWORD: changeme
      PROMETHEUS_PORT: 9091

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoscanner
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: autoscanner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autoscanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: autoscanner
          MINIO_ROOT_PASSWORD: devpassword
          MINIO_DEFAULT_BUCKETS: raw-outputs,reports,uploads,pcap,screenshots,backups,cve-mirror
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set nx base for affected
        uses: nrwl/nx-set-shas@v4

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Prisma migrate deploy
        run: pnpm prisma migrate deploy

      - name: Lint
        run: pnpm nx affected -t lint --parallel=3

      - name: Type check
        run: pnpm nx affected -t type-check --parallel=3

      - name: Unit test
        run: pnpm nx affected -t test --parallel=3 --ci

      - name: Build
        run: pnpm nx affected -t build --parallel=3

      - name: E2E (api-gateway, env-gated specs skip)
        run: pnpm nx run api-gateway-e2e:e2e

  recon-passive-e2e:
    # Phase 2 Étape 1 acceptance: boots the full backend stack (api-gateway +
    # scan-worker + parser-worker + orchestrator-worker) plus Docker-based
    # subfinder / httpx scanners, then runs the env-gated recon-passive
    # spec. This job depends on the network (pull from public registries
    # and discovery sources for hackerone.com), so failures here should be
    # investigated for transient causes before blocking a PR.
    runs-on: ubuntu-latest
    needs: lint-test-build
    timeout-minutes: 30

    env:
      NODE_ENV: test
      API_PORT: 4000
      API_HOST: 0.0.0.0
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'a-test-secret-not-secure-only-for-ci-a-test-secret' }}
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      MASTER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://autoscanner:dev@localhost:5432/autoscanner
      MONGODB_URL: mongodb://localhost:27017/autoscanner
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: autoscanner
      S3_SECRET_KEY: devpassword
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
      OPERATOR_EMAIL: admin@autoscanner.local
      OPERATOR_PASSWORD: changeme
      PROMETHEUS_PORT: 9091
      E2E_API_URL: http://localhost:4000
      E2E_EMAIL: admin@autoscanner.local
      E2E_PASSWORD: changeme
      E2E_TEMPLATE_TARGET: hackerone.com
      E2E_TEMPLATE_NAME: recon-passive
      E2E_TEMPLATE_TIMEOUT_MS: '420000'
      E2E_SUBDOMAIN_MIN_COUNT: '5'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoscanner
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: autoscanner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autoscanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: autoscanner
          MINIO_ROOT_PASSWORD: devpassword
          MINIO_DEFAULT_BUCKETS: raw-outputs,reports,uploads,pcap,screenshots,backups,cve-mirror
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Prisma migrate deploy
        run: pnpm prisma migrate deploy

      - name: Prisma seed (operator + builtin templates)
        run: pnpm seed

      - name: Pre-pull recon-passive scanner images
        run: |
          docker pull projectdiscovery/subfinder:latest
          docker pull projectdiscovery/httpx:latest

      # Build the custom scanner images so their Dockerfiles are smoke-tested
      # on every run. The recon-passive-deep e2e (which would also need
      # findomain/amass pulled) is opt-in via E2E_RUN_RECON_DEEP and is not
      # enabled in this job, so we don't pull those registry images here.
      - name: Build custom scanner images (smoke-test)
        run: pnpm scanners:build

      - name: Build backend apps
        run: pnpm nx run-many -t build -p api-gateway,scan-worker,parser-worker,orchestrator-worker --parallel=3

      - name: Start api-gateway (background)
        run: |
          node dist/apps/api-gateway/main.js > api-gateway.log 2>&1 &
          echo $! > .api-gateway.pid

      - name: Start scan-worker (background)
        run: |
          node dist/apps/scan-worker/main.js > scan-worker.log 2>&1 &
          echo $! > .scan-worker.pid

      - name: Start parser-worker (background)
        run: |
          node dist/apps/parser-worker/main.js > parser-worker.log 2>&1 &
          echo $! > .parser-worker.pid

      - name: Start orchestrator-worker (background)
        run: |
          node dist/apps/orchestrator-worker/main.js > orchestrator-worker.log 2>&1 &
          echo $! > .orchestrator-worker.pid

      - name: Wait for api-gateway /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
              echo "api-gateway is up"
              exit 0
            fi
            sleep 2
          done
          echo "api-gateway did not become ready within 120s"
          echo "--- api-gateway.log ---"
          cat api-gateway.log || true
          exit 1

      - name: Run recon-passive E2E
        run: pnpm nx run api-gateway-e2e:e2e

      - name: Dump worker logs on failure
        if: failure()
        run: |
          for f in api-gateway.log scan-worker.log parser-worker.log orchestrator-worker.log; do
            echo "--- $f ---"
            cat "$f" || true
          done

      - name: Stop background services
        if: always()
        run: |
          for pidfile in .api-gateway.pid .scan-worker.pid .parser-worker.pid .orchestrator-worker.pid; do
            if [ -f "$pidfile" ]; then
              pid=$(cat "$pidfile")
              kill "$pid" 2>/dev/null || true
            fi
          done
